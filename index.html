<!doctype html>
<html lang="es-GT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas Claras</title>
<meta name="description" content="Registro de gastos, presupuesto y cuentas compartidas en quetzales.">
<meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<header class="top">
  <div class="marca"><span class="marca-q">Q</span>Cuentas Claras</div>
  <div class="top-der">
    <button class="estado" id="estado" type="button">—</button>
    <button class="icono" id="ajustes" type="button" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="app">
  <!-- ANOTAR: solo el registro y los últimos 10 gastos -->
  <section class="vista" id="v-anotar" data-vista="anotar">
    <form id="f-gasto" class="anotar" autocomplete="off" novalidate>
      <label class="eyebrow" for="g-monto">Monto</label>
      <div class="monto">
        <span class="monto-q" aria-hidden="true">Q</span>
        <input id="g-monto" name="monto" inputmode="decimal" placeholder="0.00" enterkeyhint="next" aria-label="Monto en quetzales">
      </div>
      <input id="g-nombre" class="campo-nombre" name="nombre" placeholder="¿En qué fue? Ej.: almuerzo" enterkeyhint="done" aria-label="Descripción">
      <p class="pista" id="g-pista">&nbsp;</p>

      <label class="selector" for="g-medio">
        <span class="muestra grande" id="g-medio-color"></span>
        <span class="selector-txt"><span class="opcion-lbl">Tarjeta o cuenta</span>
          <select id="g-medio"></select></span>
      </label>

      <div class="opciones">
        <button type="button" class="opcion" id="g-para"><span class="opcion-lbl">Para</span><span id="g-para-txt">Solo mío</span></button>
        <label class="opcion" for="g-fecha"><span class="opcion-lbl">Fecha</span><span id="g-fecha-txt">Hoy</span>
          <input type="date" id="g-fecha" class="fecha-oculta"></label>
      </div>

      <p class="error" id="g-error" role="alert" hidden></p>
      <button class="btn btn-principal" id="g-enviar" type="submit">Anotar</button>
    </form>

    <div id="g-resultado" aria-live="polite"></div>

    <div class="bloque">
      <h2 class="titulo-bloque">Últimos 10 gastos</h2>
      <ul class="lista" id="g-ultimos"></ul>
    </div>
  </section>

  <!-- MES -->
  <section class="vista" id="v-mes" data-vista="mes" hidden>
    <nav class="mesnav" aria-label="Mes">
      <button type="button" class="mesnav-btn" data-mes="-1" aria-label="Mes anterior">‹</button>
      <span class="mesnav-txt" data-mes-txt></span>
      <button type="button" class="mesnav-btn" data-mes="1" aria-label="Mes siguiente">›</button>
    </nav>
    <div id="mes-cuerpo"></div>
  </section>

  <!-- BANCOS -->
  <section class="vista" id="v-bancos" data-vista="bancos" hidden>
    <div id="bancos-cuerpo"></div>
  </section>

  <!-- CUOTAS -->
  <section class="vista" id="v-cuotas" data-vista="cuotas" hidden>
    <div id="cuotas-cuerpo"></div>
  </section>

  <!-- PERSONAS -->
  <section class="vista" id="v-personas" data-vista="personas" hidden>
    <div id="personas-cuerpo"></div>
  </section>
</main>

<nav class="tabs" aria-label="Secciones">
  <button type="button" data-tab="anotar" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Anotar</span></button>
  <button type="button" data-tab="mes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9M12 19V5M19 19v-7"/></svg><span>Mes</span></button>
  <button type="button" data-tab="bancos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span>Bancos</span></button>
  <button type="button" data-tab="cuotas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Cuotas</span></button>
  <button type="button" data-tab="personas">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-5 5.5-5s4.9 2 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.2.2 3.6 1.9 4 4.3"/></svg><span>Personas</span></button>
</nav>

<div class="velo" id="velo" hidden></div>
<div class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo" hidden>
  <div class="hoja-cab">
    <h2 id="hoja-titulo"></h2>
    <button type="button" class="hoja-cerrar" id="hoja-cerrar" aria-label="Cerrar">Cerrar</button>
  </div>
  <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
</div>

<div class="aviso" id="aviso" role="status" hidden></div>

<div class="bienvenida" id="bienvenida" hidden>
  <div class="bienvenida-in">
    <div class="marca grande"><span class="marca-q">Q</span>Cuentas Claras</div>
    <p class="bienvenida-txt">Conecta tu hoja de Google Sheets para guardar tus gastos. Encuentras la dirección y la clave al publicar el Apps Script.</p>
    <form id="f-conexion" class="form" novalidate>
      <label class="campo"><span>Dirección de la API</span>
        <input id="cx-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"></label>
      <label class="campo"><span>Clave secreta</span>
        <input id="cx-clave" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
      <p class="error" id="cx-error" role="alert" hidden></p>
      <button class="btn btn-principal" type="submit" id="cx-enviar">Conectar</button>
      <button class="btn btn-texto" type="button" id="cx-local">Probar sin conexión, con datos de ejemplo</button>
    </form>
  </div>
</div>

<script src="core.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
